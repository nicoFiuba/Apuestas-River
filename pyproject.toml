[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "river-predictive-betting-engine"
version = "0.1.0"
description = "Motor predictivo de apuestas estadístico con EV+ enfocado en partidos de River Plate"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Analista de Partidos Team" }
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "httpx>=0.27.0",
    "pymysql>=1.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
